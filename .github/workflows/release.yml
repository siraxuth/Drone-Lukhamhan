name: Release

# กดรันเองที่แท็บ Actions: รวม main เข้า release (ทำให้เว็บจริงอัปเดต) + ติดแท็กเวอร์ชันจาก package.json
# ทำได้เมื่อ CI ของ main ผ่านแล้ว และ CHANGELOG.md มีหัวข้อของเวอร์ชันนั้น
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'พิมพ์ release เพื่อยืนยันว่าจะอัปเดตเว็บจริง'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: ${{ inputs.confirm == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: อ่านเวอร์ชัน
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: ตรวจว่ามีหัวข้อใน CHANGELOG
        run: |
          grep -q "^## \[${{ steps.v.outputs.version }}\]" CHANGELOG.md || { echo "ไม่พบ ## [${{ steps.v.outputs.version }}] ใน CHANGELOG.md"; exit 1; }
      - name: ตรวจว่าแท็กยังไม่ถูกใช้
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then echo "แท็ก v${{ steps.v.outputs.version }} มีอยู่แล้ว ต้องเพิ่มเลขเวอร์ชันก่อน"; exit 1; fi
      - name: ดึงข้อความของเวอร์ชันนี้จาก CHANGELOG
        run: |
          awk '/^## \[${{ steps.v.outputs.version }}\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > release-notes.md
      - name: รวม main เข้า release (fast-forward)
        run: |
          git fetch origin release || true
          git checkout -B release origin/release 2>/dev/null || git checkout -b release
          git merge --ff-only origin/main
          git push origin release
      - name: ติดแท็กและสร้าง GitHub Release
        run: |
          git tag "v${{ steps.v.outputs.version }}"
          git push origin "v${{ steps.v.outputs.version }}"
          gh release create "v${{ steps.v.outputs.version }}" --title "v${{ steps.v.outputs.version }}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
